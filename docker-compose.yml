services:
  sonora:
    image: ghcr.io/rokent/sonora:latest
    container_name: sonora
    restart: unless-stopped
    network_mode: host
    # A tiny init as PID 1: reaps the ffmpeg / shairport-sync / dbus-send
    # children Sonora starts and passes stop signals on.
    init: true
    environment:
      # The port the page is served on. With host networking there is no
      # port mapping, so change it here rather than with `ports:`.
      SONORA_WEB_PORT: 50205
      # Optional: sign in with Authentik (or any OIDC provider). Leave
      # SONORA_OIDC_ISSUER unset to keep Sonora login-free. See docs/authentik.md.
      # SONORA_OIDC_ISSUER: https://authentik.example.com/application/o/sonora/
      # SONORA_OIDC_CLIENT_ID: sonora
      # SONORA_OIDC_CLIENT_SECRET: change-me
      # Only let members of this group in (optional).
      # SONORA_OIDC_GROUP: sonora-users
      # Set to 1 when Sonora sits behind a reverse proxy you trust.
      # SONORA_TRUST_PROXY: 1
      # Optional shared browser (see docs/remote-browser.md): full control for
      # household members, watch-only for guests. Watch-only is enforced by
      # neko's user profile below (can_host: false), not by Sonora. If Sonora
      # is on HTTPS, neko must be too (an http:// frame is blocked as mixed
      # content): put it behind the same proxy.
      # SONORA_NEKO_URL: http://sonora.local:8080/?usr=host&pwd=change-me-admin
      # SONORA_NEKO_VIEW_URL: http://sonora.local:8080/?usr=guest&pwd=change-me-user
      # If a speaker will not play YouTube items, set aac (needs ffmpeg, which
      # the image has; no seeking). See docs/youtube.md.
      # SONORA_YOUTUBE_FORMAT: m4a
      # AirPlay receivers (each running party and room as an AirPlay speaker,
      # ports 5100-5199 TCP/UDP + mDNS; see docs/airplay.md). 0 turns them off.
      # SONORA_AIRPLAY: 0
      # Windows sound (Scream) receiver on UDP 4010 (multicast 239.255.77.77
      # or unicast; see docs/windows-sound.md). 0 turns it off.
      # SONORA_SCREAM_PORT: 0
    volumes:
      - ./sonora-data:/data

  # Optional: a shared browser the whole party can watch (and members control).
  # neko:
  #   image: ghcr.io/m1k1o/neko/chromium:latest
  #   container_name: neko
  #   restart: unless-stopped
  #   shm_size: 2gb
  #   cap_add: [SYS_ADMIN]
  #   network_mode: host
  #   environment:
  #     NEKO_DESKTOP_SCREEN: 1920x1080@30
  #     NEKO_MEMBER_PROVIDER: multiuser
  #     NEKO_MEMBER_MULTIUSER_USER_PASSWORD: change-me-user
  #     NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: change-me-admin
  #     # The user (guest/view) login may watch but never take control:
  #     NEKO_MEMBER_MULTIUSER_USER_PROFILE: >-
  #       {"name":"","is_admin":false,"can_login":true,"can_connect":true,
  #       "can_watch":true,"can_host":false,"can_share_media":false,
  #       "can_access_clipboard":false,"sends_inactive_cursor":false,
  #       "can_see_inactive_cursors":false}
  #     NEKO_WEBRTC_EPR: 52000-52100
  #     NEKO_WEBRTC_ICELITE: 1
  #   volumes:
  #     - ./neko-policies.json:/etc/chromium/policies/managed/policies.json:ro
