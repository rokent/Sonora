configuration:
  web_port:
    name: Web port
    description: >-
      Where Sonora's page answers on your network, for browsers outside
      Home Assistant. The sidebar doesn't use it.
  event_port:
    name: Speaker callback port
    description: >-
      Where the speakers report changes back to Sonora. Any free port will do.
  airplay:
    name: AirPlay receivers
    description: >-
      Show each running party and each room as an AirPlay speaker, so phones
      and computers can send their sound to it. Uses ports 5100-5199 and
      mDNS.
